name: relay-deploy
# Deploys relay/ to Cloudflare Workers, sets its RELAY_KEY secret, checks it, then commits relay/DEPLOY_STATUS.md.
on:
  push:
    branches: [main]
    paths: ["relay/src/**", "relay/wrangler.toml", ".github/workflows/relay-deploy.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: CLOUDFLARE
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets present?
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            printf '# Relay deploy\n\nNot deployed: add CLOUDFLARE_API_TOKEN to the CLOUDFLARE environment.\n' > relay/DEPLOY_STATUS.md
            echo "skip=1" >> "$GITHUB_ENV"
          fi
      - if: env.skip != '1'
        id: deploy
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: |
          cd relay
          set +e
          # tolerate pasted whitespace, quotes or a "Bearer " prefix
          tok=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]"' | sed -E 's/^[Bb]earer//')
          export CLOUDFLARE_API_TOKEN="$tok"
          shape="length ${#RAW_TOKEN} raw / ${#tok} cleaned; whitespace removed: $([ "${#RAW_TOKEN}" != "${#tok}" ] && echo yes || echo no); only hex: $(printf '%s' "$tok" | grep -qE '^[0-9a-f]+$' && echo yes || echo no)"
          npx -y wrangler@4 deploy 2>&1 | tee ../deploy.log
          code=${PIPESTATUS[0]}
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' ../deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ]; then
            { printf '# Relay deploy\n\nDeploy failed (exit %s). Last lines of the wrangler output:\n\n```\n' "$code"
              tail -40 ../deploy.log | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]+/<email>/g'
              printf '```\n\nToken shape (no value shown): %s\n' "$shape"; } > DEPLOY_STATUS.md
            echo "skip=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # The Worker refuses every request until RELAY_KEY is set, so set it whenever the secret exists.
          if [ -n "$RELAY_KEY" ]; then
            printf '%s' "$RELAY_KEY" | npx -y wrangler@4 secret put RELAY_KEY >/dev/null 2>&1 && echo "RELAY_KEY set" || echo "RELAY_KEY not set (secret put failed)"
          else
            echo "No RELAY_KEY secret: the relay stays locked (403 for every request)."
          fi
      - if: env.skip != '1'
        name: Check the live relay
        env:
          URL: ${{ steps.deploy.outputs.url }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: |
          sleep 10
          anon=$(curl -s -o /dev/null -w '%{http_code}' "$URL/?url=https://example.com")
          code=$(curl -s -o page.html -w '%{http_code}' -H "x-relay-key: $RELAY_KEY" "$URL/?url=https://example.com")
          grep -q "Example Domain" page.html && ok=yes || ok=no
          printf '# Relay deploy\n\nLocked: requests need an `x-relay-key` header.\n\n- without a key: HTTP %s (should be 403)\n- with the key, fetch https://example.com: HTTP %s, page fetched: %s\n- checked: %s\n' \
            "$anon" "$code" "$ok" "$(date -u +%FT%TZ)" > relay/DEPLOY_STATUS.md
          cat relay/DEPLOY_STATUS.md
      - name: Commit status
        if: always()
        run: |
          git config user.name "relay-deploy"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay/DEPLOY_STATUS.md
          git diff --cached --quiet && exit 0
          git commit -q -m "relay: deploy status"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 10; done
