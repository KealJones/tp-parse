name: relay-deploy
# Deploys relay/ to Cloudflare Workers and checks it, then commits relay/DEPLOY_STATUS.md.
on:
  push:
    branches: [main]
    paths: ["relay/src/**", "relay/wrangler.toml", ".github/workflows/relay-deploy.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: CLOUDFLARE
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets present?
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            printf '# Relay deploy\n\nNot deployed: add CLOUDFLARE_API_TOKEN to the CLOUDFLARE environment.\n' > relay/DEPLOY_STATUS.md
            echo "skip=1" >> "$GITHUB_ENV"
          fi
      - if: env.skip != '1'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd relay
          set +e
          npx -y wrangler@4 deploy 2>&1 | tee ../deploy.log
          code=${PIPESTATUS[0]}
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' ../deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ]; then
            { printf '# Relay deploy\n\nDeploy failed (exit %s). Last lines of the wrangler output:\n\n```\n' "$code"
              tail -40 ../deploy.log | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]+/<email>/g'
              printf '```\n'; } > DEPLOY_STATUS.md
            echo "skip=1" >> "$GITHUB_ENV"
          fi
      - if: env.skip != '1'
        name: Check the live relay
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          sleep 10
          code=$(curl -s -o page.html -w '%{http_code}' "$URL/?url=https://example.com")
          cors=$(curl -s -D - -o /dev/null "$URL/?url=https://example.com" | grep -i '^access-control-allow-origin' | tr -d '\r')
          grep -q "Example Domain" page.html && ok=yes || ok=no
          printf '# Relay deploy\n\nURL: %s\n\n- fetch https://example.com: HTTP %s, page fetched: %s\n- %s\n- checked: %s\n' \
            "$URL" "$code" "$ok" "$cors" "$(date -u +%FT%TZ)" > relay/DEPLOY_STATUS.md
          cat relay/DEPLOY_STATUS.md
      - name: Commit status
        if: always()
        run: |
          git config user.name "relay-deploy"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay/DEPLOY_STATUS.md
          git diff --cached --quiet && exit 0
          git commit -q -m "relay: deploy status"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 10; done
